<div class="food-content">
  <header class="restaurant-hero">
    <p class="restaurant-kicker">Food Menu</p>
    <h1>Foods</h1>
    <p class="restaurant-subtitle">
      Choose your favorite meals from our diverse menu. Fast delivery, trusted
      kitchens, and
    </p>
    <div class="restaurant-stats">
      <article class="stat-card">
        <span class="stat-value" id="food-count">120+</span>
        <span class="stat-label">Foods</span>
      </article>
      <article class="stat-card">
        <span class="stat-value" id="average-food-rating">4.8</span>
        <span class="stat-label">Average Rating</span>
      </article>
      <article class="stat-card">
        <span class="stat-value" id="available-food-count">25</span>
        <span class="stat-label">Available Foods</span>
      </article>
    </div>
  </header>

  <div class="food-grid-wrap">
    <div class="restaurant-toolbar">
      <h2>Popular Right Now</h2>
      <div class="filter-dropdown">
        <button class="filter-toggle" type="button">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="filter-menu">
          <!-- Category -->
          <div class="filter-group">
            <label for="category">Category</label>

            <select id="category" class="filter-select">
              <option value="all">All</option>
              <option value="fast-food">Fast Food</option>
              <option value="cafe">Cafe</option>
              <option value="pizza">Pizza</option>
            </select>
          </div>

          <!-- Price -->
          <div class="filter-group">
            <label for="priceRange">
              Max Price:
              <strong id="priceValue">$50</strong>
            </label>

            <input
              type="range"
              id="priceRange"
              class="filter-range"
              min="0"
              max="100"
              value="50"
              oninput="
                document.getElementById('priceValue').innerText =
                  '$' + this.value
              "
            />
          </div>

          <!-- Available -->
          <div class="filter-group checkbox-group">
            <label>
              <input type="checkbox" id="isAvailable" />
              Available Now
            </label>
          </div>

          <!-- Discount -->
          <div class="filter-group checkbox-group">
            <label>
              <input type="checkbox" id="isDiscount" />
              Discount Offers
            </label>
          </div>

          <!-- Rating -->
          <div class="filter-group">
            <label for="rating">Minimum Rating</label>

            <select id="rating" class="filter-select">
              <option value="0">All Ratings</option>
              <option value="5">5 Stars</option>
              <option value="4">4+ Stars</option>
              <option value="3">3+ Stars</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="food-grid" id="food-grid"></div>
  </div>
</div>
